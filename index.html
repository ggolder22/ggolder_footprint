<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora Huella de Carbono</title>
  <meta name="description" content="Inventario de gases de efecto invernadero según GHG Protocol e ISO 14064-1, con factores de emisión de Climatiq.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%231f7a5a'/><path d='M9 19c0-6 5-10 14-10-1 9-5 14-11 14-1 0-2 0-3-1l-2 3' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar no-print">
    <button class="icon-btn menu-btn" data-action="toggle-nav" aria-label="Abrir menú">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Huella de Carbono</div>
        <div class="brand-sub">GHG Protocol · ISO 14064-1 · Climatiq</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="save-status" class="save-status"></span>
      <button class="btn ghost" data-action="export-json" title="Descargar el proyecto como archivo JSON">Guardar archivo</button>
      <label class="btn ghost" title="Abrir un proyecto guardado">
        Abrir archivo<input type="file" accept="application/json,.json" id="import-file" hidden>
      </label>
      <button class="btn ghost" data-action="open-settings">Ajustes</button>
    </div>
  </header>

  <div class="layout">
    <nav id="steps-nav" class="steps no-print" aria-label="Pasos del inventario"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/standards.js"></script>
  <script src="js/climatiq.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
